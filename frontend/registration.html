<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Hack The Exit</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/registration.css">
</head>
<body>

  <header class="top-nav">
    <div class="brand">HACK THE<span> EXIT</span></div>
    <div style="font-family: var(--font-mono); font-size: 0.9rem; color: var(--text-dark);" id="pc-display">PC-ID: LOAD...</div>
  </header>

  <main class="main-container">
    <div class="glass-panel auth-card">
      <h2 class="card-title title-glow" style="margin-bottom: 0.5rem;">AGENT REGISTRATION</h2>
      
      <!-- Event Schedule & Room Badge -->
      <div style="text-align: center; margin-bottom: 1.2rem;">
        <span style="display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; flex-wrap: wrap; background: rgba(0, 240, 255, 0.08); border: 1px solid rgba(0, 240, 255, 0.25); border-radius: 20px; padding: 0.35rem 1rem; font-family: var(--font-mono); font-size: 0.8rem; color: #38bdf8;">
          <span>📅 <strong>9 September 2026</strong></span>
          <span>•</span>
          <span style="color: #00ff88;">⏰ <strong>3:00 PM</strong></span>
          <span>•</span>
          <span style="color: #facc15;">📍 <strong>ROOM: D-102</strong></span>
        </span>
      </div>

      <div id="alert-box" class="alert"></div>

      <form id="registration-form">
        <div class="form-group">
          <label for="name">Student Name</label>
          <input type="text" id="name" class="form-control" placeholder="Enter full name" required>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="department">Department</label>
            <select id="department" class="form-control" required>
              <option value="" disabled selected>Loading departments...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="semester">Semester</label>
            <select id="semester" class="form-control" required>
              <option value="Sem 1">Sem 1</option>
              <option value="Sem 2">Sem 2</option>
              <option value="Sem 3">Sem 3</option>
              <option value="Sem 4">Sem 4</option>
              <option value="Sem 5">Sem 5</option>
              <option value="Sem 6">Sem 6</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="enrollmentNumber">Enrollment Number</label>
          <input type="text" id="enrollmentNumber" class="form-control" placeholder="Enter Enrollment ID" required>
        </div>

        <div class="form-group">
          <label for="whatsapp">WhatsApp Number</label>
          <input type="tel" id="whatsapp" class="form-control" placeholder="Enter 10-digit mobile number" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="Enter email address" required>
        </div>

        <div class="welcome-btn-group" style="margin-top: 2rem;">
          <button type="submit" class="btn-cyber btn-cyber-green">AUTHENTICATE & ENTER</button>
        </div>
        <div style="text-align: center; margin-top: 1.2rem;">
          <a href="/rules.html" target="_blank" style="color: var(--accent-cyan); font-size: 0.85rem; font-family: var(--font-mono); text-decoration: none; display: inline-flex; align-items: center; gap: 0.35rem;">
            <span>📖</span> <span>READ COMPETITION RULES ↗</span>
          </a>
        </div>
      </form>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/registration.js"></script>
</body>
</html>
