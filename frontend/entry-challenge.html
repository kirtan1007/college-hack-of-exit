<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entry Decryption - Hack The Exit</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/registration.css">
</head>
<body>

  <header class="top-nav">
    <div class="brand">HACK THE<span> EXIT</span></div>
    <div style="font-family: var(--font-mono); font-size: 0.9rem; color: var(--text-dark);" id="pc-display">PC-ID: LOAD...</div>
  </header>

  <main class="main-container">
    <div class="glass-panel auth-card">
      <h2 class="card-title title-glow">DECRYPTION TERMINAL</h2>
      
      <p style="text-align: center; color: var(--text-secondary); margin-bottom: 1rem;">
        Convert the following Octal security token into its equivalent 4-bit Binary password to bypass the firewall door:
      </p>

      <div id="alert-box" class="alert"></div>

      <div class="octal-display">
        <div class="octal-number" id="octal-value">--₈</div>
        <div class="octal-sub">OCTAL TOKEN</div>
      </div>

      <form id="unlock-form">
        <div class="form-group" style="text-align: center;">
          <label for="binaryPassword" style="margin-bottom: 0.8rem;">ENTER BINARY PASSWORD</label>
          <input type="text" id="binaryPassword" class="form-control" placeholder="e.g. 0101" style="font-family: var(--font-mono); font-size: 1.8rem; text-align: center; letter-spacing: 6px; max-width: 250px; margin: 0 auto;" required>
        </div>

        <div class="welcome-btn-group" style="margin-top: 2rem;">
          <button type="submit" class="btn-cyber btn-cyber-green">BYPASS FIREWALL</button>
        </div>
      </form>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/entryChallenge.js"></script>
</body>
</html>
